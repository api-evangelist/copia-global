name: Copia Global
description: Copia Global was a Kenyan B2C e-commerce and last-mile distribution company founded by Tracey
  Turner and Jonathan Lewis to serve middle- and low-income consumers across rural and peri-urban Africa.
  Rather than a consumer website, it ran an agent-network model in which customers placed catalog orders through
  local agents using mobile and USSD technology, and Copia processed, aggregated, and delivered goods within
  days. Backed by investors including DCVC and Goodwell, the company raised a $50M Series C in 2022 to expand,
  but suspended Uganda operations in 2023, entered administration in May 2024, and was subsequently placed
  into liquidation. It exposes no public API, developer portal, or specification; its primary domain now
  resolves to a parked page. This profile is retained as a portfolio lead for network coverage.
